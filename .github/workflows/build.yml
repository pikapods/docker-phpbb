name: Build and publish

on:
  workflow_dispatch:
    inputs:
      phpbb_version:
        description: "phpBB version (e.g. 3.3.16)"
        required: true
        type: string
      php_version:
        description: "PHP minor version"
        required: false
        default: "8.3"
        type: string
      publish:
        description: "Publish to GHCR after tests pass"
        required: false
        default: true
        type: boolean
      base_digest:
        description: "sha256 of the base image to pin (optional; resolved on-demand otherwise)"
        required: false
        default: ""
        type: string
      revision:
        description: "Manual revision override (e.g. r1). Otherwise computed by reading the prior published label."
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

# Serialize builds so revision computation can't race itself: two concurrent
# runs against the same PHPBB_VER would otherwise both read 'r2' and both
# write 'r3'. With concurrency: build, the second run reads the first's
# freshly-pushed label and computes the next number correctly.
concurrency: build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      phpbb_version: ${{ steps.vars.outputs.phpbb_version }}
      php_version: ${{ steps.vars.outputs.php_version }}
      revision: ${{ steps.revision.outputs.revision }}
      base_digest: ${{ steps.base.outputs.base_digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve build args
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BB_VER="${{ inputs.phpbb_version }}"
            PHP_VER="${{ inputs.php_version }}"
          else
            # Tag form: v<phpbb-version> (e.g. v3.3.16)
            BB_VER="${GITHUB_REF_NAME#v}"
            PHP_VER="8.3"
          fi
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "phpbb_version=$BB_VER" >>"$GITHUB_OUTPUT"
          echo "php_version=$PHP_VER"  >>"$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >>"$GITHUB_OUTPUT"

      - uses: imjasonh/setup-crane@v0.4

      - name: Resolve base image digest
        id: base
        env:
          PHP_VER: ${{ steps.vars.outputs.php_version }}
          INPUT_DIGEST: ${{ inputs.base_digest }}
        run: |
          set -euo pipefail
          BASE_REF="serversideup/php:${PHP_VER}-fpm-nginx-alpine"
          if [ -n "${INPUT_DIGEST}" ]; then
            digest="${INPUT_DIGEST}"
            echo "using digest provided by caller: ${digest}"
          else
            digest=$(crane digest "${BASE_REF}")
            echo "resolved current digest: ${digest}"
          fi
          echo "base_digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "base_image=${BASE_REF}@${digest}" >>"$GITHUB_OUTPUT"

      - name: Compute image revision
        id: revision
        env:
          BB_VER: ${{ steps.vars.outputs.phpbb_version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REVISION}" ]; then
            echo "revision=${INPUT_REVISION}" >>"$GITHUB_OUTPUT"
            echo "using revision override: ${INPUT_REVISION}"
            exit 0
          fi
          # Read the published mutable tag's image.version label
          # (form: <phpbb-version>-<revision>, e.g. 3.3.16-r1). Increment
          # the trailing rN. Missing tag, missing label, or non-rN suffix
          # all fall back to r1 — covers first builds and legacy images
          # published before the -rN scheme rolled out.
          REF="${REGISTRY}/${IMAGE_NAME}:${BB_VER}"
          if cfg=$(crane config "${REF}" 2>/dev/null); then
            prev=$(echo "${cfg}" | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')
            prev_rev="${prev##*-}"
            case "${prev_rev}" in
              r[0-9]*)
                next=$(( ${prev_rev#r} + 1 ))
                revision="r${next}"
                ;;
              *)
                revision="r1"
                ;;
            esac
          else
            revision="r1"
          fi
          echo "computed revision: ${revision} (prev label: ${prev:-<none>})"
          echo "revision=${revision}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image (local load)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            PHPBB_VERSION=${{ steps.vars.outputs.phpbb_version }}
            PHP_VERSION=${{ steps.vars.outputs.php_version }}
            BASE_IMAGE=${{ steps.base.outputs.base_image }}
            BASE_DIGEST=${{ steps.base.outputs.base_digest }}
            IMAGE_REVISION=${{ steps.revision.outputs.revision }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          tags: phpbb:test
          provenance: false

      - name: Save image tarball
        run: docker save phpbb:test -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r tests/requirements.txt

      - name: Image + runtime tests
        env:
          IMAGE: phpbb:test
        run: pytest -v tests/ --junitxml=report.xml

      - name: Dump phpbb container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter "name=^bb-" --format '{{.Names}}'); do
            echo "--- $c ---"
            docker logs "$c" 2>&1 || true
          done

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: report.xml
          retention-days: 7

  compose-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Bring up compose stack
        env:
          PHPBB_IMAGE: phpbb:test
        run: docker compose up -d

      - name: Wait for /index.php to return 200
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/index.php || echo "000")
            if [ "$code" = "200" ]; then
              echo "ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "timed out waiting for /index.php"
          exit 1

      - name: Assert healthcheck propagated
        # Dockerfile HEALTHCHECK has interval=30s, so status stays `starting`
        # until the first probe fires. Poll up to ~90s.
        run: |
          for i in $(seq 1 18); do
            status=$(docker inspect --format '{{.State.Health.Status}}' phpbb-phpbb-1)
            echo "health status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container reported unhealthy"
              exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for healthy status"
          exit 1

      - name: Assert clean first boot
        run: |
          restarts=$(docker inspect --format '{{.RestartCount}}' phpbb-phpbb-1)
          echo "restart count: $restarts"
          [ "$restarts" = "0" ] || exit 1
          if docker compose logs phpbb 2>&1 | grep -E 'not reachable|FATAL|Restarting'; then
            echo "found error markers in phpbb logs"
            exit 1
          fi

      - name: Assert install dir removed
        run: |
          if docker exec phpbb-phpbb-1 test -d /var/www/html/install; then
            echo "install dir was not removed post-install"
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    needs: [build, test, compose-test]
    # Tag pushes always publish. Manual dispatch publishes unless the
    # `publish` input is set to false (test-only runs).
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push refs to each registry:
      #   <version>-<revision>   immutable (e.g. 3.3.16-r2). This exact build,
      #                          never reused. Pin here for byte-for-byte
      #                          reproducibility.
      #   <version>              mutable phpBB-version alias (e.g. 3.3.16).
      #                          Floats to the latest revision so base-image
      #                          security rebuilds land in place — users pinned
      #                          here receive patches without re-pinning.
      #   latest                 floating pointer — only published for stable
      #                          releases (MAJOR.MINOR.PATCH). Future
      #                          prerelease tags (-RC1, -PL1) would publish
      #                          their own refs but never claim latest.
      - name: Tag and push
        env:
          BB_VER: ${{ needs.build.outputs.phpbb_version }}
          REVISION: ${{ needs.build.outputs.revision }}
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/docker-phpbb
        run: |
          set -euo pipefail
          is_stable=false
          if [[ "${BB_VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_stable=true
          fi
          for REPO in "${REGISTRY}/${IMAGE_NAME}" "docker.io/${DOCKERHUB_REPO}"; do
            docker tag phpbb:test "${REPO}:${BB_VER}-${REVISION}"
            docker tag phpbb:test "${REPO}:${BB_VER}"
            docker push "${REPO}:${BB_VER}-${REVISION}"
            docker push "${REPO}:${BB_VER}"
            if [ "${is_stable}" = "true" ]; then
              docker tag phpbb:test "${REPO}:latest"
              docker push "${REPO}:latest"
            fi
          done
