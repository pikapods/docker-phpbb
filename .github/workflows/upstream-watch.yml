name: Upstream watch

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.3"
  # Pinned upstream series (major.minor). Auto-rebuilds only fire for patch
  # bumps within this line, e.g. 3.3.16 -> 3.3.17. Bump this manually to opt
  # into a new series (4.0); use workflow_dispatch on build.yml for one-off
  # out-of-series builds.
  #
  # Two independent triggers:
  #
  # 1. New-version detection. Polls phpBB's `releases/latest` and skips when
  #    the upstream tag is outside SERIES or the download mirror hasn't
  #    caught up yet.
  #
  # 2. Base-image drift detection. Resolves the current serversideup/php
  #    digest and compares against the digest recorded in the published
  #    image's OCI labels. Drift only triggers a rebuild for the current
  #    in-series upstream version; the rebuild bumps the immutable -rN
  #    suffix and refreshes the mutable <version> tag in place, so users
  #    pinned to 3.3.16 receive Alpine/PHP/nginx security patches without
  #    re-pinning.
  SERIES: "3.3"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      - uses: imjasonh/setup-crane@v0.4

      - name: Find build to trigger
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE_REF="serversideup/php:${PHP_VERSION}-fpm-nginx-alpine"
          current_digest=$(crane digest "${BASE_REF}")
          echo "current base digest: ${current_digest}"

          # phpbb/phpbb publishes git tags (e.g. release-3.3.16) but does
          # not cut GitHub Releases, so releases/latest 404s. Pull tags and
          # filter for stable in-series — the regex drops -RCx / -ax /
          # other prerelease suffixes, then version-sort picks the highest.
          series_re="^release-${SERIES//./\\.}\\.[0-9]+\$"
          upstream=$(
            gh api 'repos/phpbb/phpbb/tags?per_page=30' --jq '.[].name' \
              | grep -E "${series_re}" \
              | sed 's/^release-//' \
              | sort -V \
              | tail -n 1
          )
          if [ -z "${upstream}" ]; then
            echo "no stable release tag found for series ${SERIES}"
            exit 0
          fi
          echo "upstream=${upstream}"
          upstream_series="${upstream%.*}"

          # phpBB tags GitHub releases before the download mirror catches up.
          # Skip this cycle if the zip isn't there yet; next hour's run will retry.
          zip_url="https://download.phpbb.com/pub/release/${upstream_series}/${upstream}/phpBB-${upstream}.zip"
          zip_status=$(curl -sI -o /dev/null -w '%{http_code}' "${zip_url}")
          if [ "${zip_status}" != "200" ]; then
            echo "download not yet available at ${zip_url} (HTTP ${zip_status}); will retry next run"
            exit 0
          fi

          # Authenticate crane to GHCR so the manifest/config probes work
          # against private packages too. With public packages this is
          # redundant — but cheap, and required when the package doesn't
          # exist yet (GHCR 403s anonymous reads of nonexistent repos,
          # indistinguishable from auth failure).
          crane auth login "${REGISTRY}" -u "${GITHUB_ACTOR}" -p "${GH_TOKEN}"

          REF="${REGISTRY}/${IMAGE_NAME}:${upstream}"
          reason=""
          if ! crane manifest "${REF}" >/dev/null 2>&1; then
            reason="new-version"
            echo "${upstream} not in registry; will trigger build"
          else
            # --- Base-image drift detection ---
            # Compare current base digest against the one baked into the
            # published image's labels. Mismatch => rebuild same version
            # against the fresh base; build.yml bumps -rN.
            cfg=$(crane config "${REF}" 2>/dev/null || true)
            if [ -z "${cfg}" ]; then
              echo "${upstream} manifest exists but config unreadable; drift check N/A"
              exit 0
            fi
            published_digest=$(echo "${cfg}" | jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty')
            if [ "${published_digest}" = "${current_digest}" ]; then
              echo "${upstream} base digest matches (${current_digest}); no drift"
              exit 0
            fi
            reason="base-drift"
            echo "${upstream} base drift: published=${published_digest:-<none>} current=${current_digest}; will trigger rebuild"
          fi

          {
            echo "upstream=${upstream}"
            echo "base_digest=${current_digest}"
            echo "reason=${reason}"
          } >>"$GITHUB_OUTPUT"

      - name: Trigger build
        if: steps.check.outputs.upstream != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ steps.check.outputs.upstream }}
          BASE_DIGEST: ${{ steps.check.outputs.base_digest }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "triggering build for ${UPSTREAM} (${REASON})"
          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f phpbb_version="${UPSTREAM}" \
            -f php_version="${PHP_VERSION}" \
            -f base_digest="${BASE_DIGEST}"
