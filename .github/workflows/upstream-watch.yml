name: Upstream watch

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: "8.3"
  # Pinned upstream series (major.minor). Auto-rebuilds only fire for patch
  # bumps within this line, e.g. 3.3.16 -> 3.3.17. Bump this manually to opt
  # into a new series (4.0); use workflow_dispatch on build.yml for one-off
  # out-of-series builds.
  SERIES: "3.3"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      - name: Compare upstream release to published tags
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # phpBB tags releases as `release-3.3.16`, not `v3.3.16`.
          upstream_tag=$(gh api repos/phpbb/phpbb/releases/latest --jq .tag_name)
          echo "upstream_tag=${upstream_tag}"

          upstream="${upstream_tag#release-}"
          # Defensive: also strip a leading v in case upstream changes scheme.
          upstream="${upstream#v}"
          echo "upstream=${upstream}"

          upstream_series="${upstream%.*}"
          if [ "${upstream_series}" != "${SERIES}" ]; then
            echo "upstream ${upstream} is outside pinned series ${SERIES}; skipping auto-rebuild"
            echo "published=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Ask GHCR's OCI registry whether the tag is already published.
          # The token endpoint hands out anonymous pull tokens for public
          # images; for private images, swap in a PAT with read:packages.
          token=$(curl -fsS "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${IMAGE_NAME}:pull" | jq -r .token)

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${upstream}")

          if [ "${status}" = "200" ]; then
            echo "published=true"  >>"$GITHUB_OUTPUT"
            echo "${upstream} already published"
          else
            echo "published=false" >>"$GITHUB_OUTPUT"
            echo "upstream=${upstream}" >>"$GITHUB_OUTPUT"
            echo "${upstream} not in registry (HTTP ${status}); will trigger build"
          fi

      - name: Trigger build
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            -f phpbb_version='${{ steps.check.outputs.upstream }}' \
            -f php_version='${{ env.PHP_VERSION }}'
