# phpBB-specific nginx overrides.
# The serversideup/php-nginx default doc root is /var/www/html/public; phpBB
# serves from the web root, so override.

root /var/www/html;

# phpBB attachment uploads default to ~30 MB; match it here so nginx doesn't
# reject before php-fpm sees the request.
client_max_body_size 30m;

# Deny direct access to internals. These regex locations are loaded ahead of
# the base's `\.php$` block via site-opts.d, so they win for matching URIs.
# install/ stays accessible only on first boot — bootstrap removes it after
# phpbbcli succeeds, after which any /install/* request hits a real 404.
location ~* ^/(cache|files|store|images/avatars/upload|includes|phpbb|vendor|config|language)/ {
    deny all;
    return 403;
}

location ~* ^/(config\.php|common\.php)$ {
    deny all;
    return 403;
}

# Belt-and-suspenders: the bootstrap removes /var/www/html/install on every
# boot once /data/config.php is non-empty (i.e. installed). This block adds
# a deny rule on top so a failed cleanup or a stale image layer can't expose
# the installer at runtime.
location ~* ^/install/ {
    deny all;
    return 403;
}

# Long-lived cache for static assets bundled with the styles.
location ~* ^/(images|styles)/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
}
